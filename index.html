<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedomination</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Oswald, sans-serif;
            background: url('static/side-background.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            font-size: larger;
        }

        h2 {
            font-weight: 300;
            font-size: xx-large;
            margin: 20px 0;
        }

        h3 {
            font-weight: 300;
            font-size: 24px;
            margin: 20px 0;
        }

        .container {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            color: white;
            overflow-y: auto;
        }

        .socials {
            margin: 20px 0;
        }

        .socials a {
            margin: 5px;
            text-decoration: none;
            display: inline-block;
        }

        .socials img {
            width: 30px;
            height: 30px;
        }

        .live-dates,
        .gallery,
        .contact {
            margin: 50px 0;
        }

        .gallery img {
            width: 100%;
            max-width: 700px;
            height: auto;
            margin: 10px;
            border: solid 1px rgba(255, 255, 255, 0.5)
        }

        iframe {
            width: 100%;
            max-width: 600px;
            height: auto;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            background: red;
            color: white;
            border: none;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
            align-self: center;
            /* Center the button horizontally */
        }

        .logo {
            max-width: 100%;
            height: auto;
        }

        .divider {
            width: 50%;
            margin: 20px auto;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .album-release {
            margin: 30px 0;
        }

        .album-cover {
            width: 100%;
            max-width: 700px;
            height: auto;
            margin-top: 10px;
            border: solid 1px rgba(255, 255, 255, 0.5)
        }

        .row {
            display: flex;
            align-items: center;
            /* Vertically center the content */
            text-align: left;
            margin: 0 50px;
            flex-wrap: wrap; /* Allow wrapping */
        }

        .column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Vertically center the content */
        }

        .column:nth-child(1) {
            flex: 0 0 15%;
        }

        .column:nth-child(2) {
            flex: 0 0 55%;
        }

        .column:nth-child(3) {
            flex: 0 0 15%;
        }

        .column:nth-child(4) {
            flex: 0 0 15%;
        }

        /* Clear floats after the columns */
        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        @media (max-width: 850px) {
            .gallery img,
            .album-cover {
                width: 100%;
                height: auto;
            }

            iframe {
                width: 100%;
                height: auto;
            }

            .row {
                flex-direction: column; /* Stack columns vertically on small screens */
                margin: 0 10px; /* Reduce margin for smaller screens */
                margin-bottom: 30px;
            }

            .column {
                flex: 0 0 100%; /* Make each column take full width */
                margin-bottom: 10px; /* Add some space between rows */
                text-align: center; /* Center text */
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="static/logo-black.png" alt="Freedomination logo" class="logo">

        <div class="socials">
            <a href="http://facebook.com/freedominationband"><img src="static/facebook-icon.png" alt="Facebook"></a>
            <a href="http://instagram.com/freedominationband"><img src="static/youtube-icon.png" alt="Youtube"></a>
            <a href="http://youtube.com/freedominationband"><img src="static/instagram-icon.png" alt="Instagram"></a>
            <a href="http://tiktok.com/@freedominationband"><img src="static/tiktok-icon.png" alt="Tiktok"></a>
        </div>

        <div class="album-release">
            <h3>DEBUT ALBUM OUT 26TH FEBRUARY 2025</h3>
            <img src="static/album-cover.jpg" alt="Album Cover" class="album-cover">
        </div>
        <iframe style="border-radius:12px"
            src="https://open.spotify.com/embed/track/0KYkK6U6J5xBs55iYhsl65?utm_source=generator&theme=0" width="100%"
            height="352" frameBorder="0" allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        <iframe src="https://www.youtube.com/embed/EREyxQIBoGM" frameborder="0" allowfullscreen></iframe>

        <div class="live-dates">
            <h2>Upcoming Live Dates</h2>
            <div class="row">
                <div class="column">
                    7.3.2025
                </div>
                <div class="column">
                    Club Ukkosmyrsky with Mutant Blast & Dreadsight</div>
                <div class="column">Vantaa, FI</div>
                <div class="column">
                    <a href="https://www.tiketti.fi/club-ukkosmyrsky-ii-skenesali-vantaa-lippuja/106567"
                        class="btn">Tickets</a>
                </div>
            </div>


            <div class="row">
                <div class="column">
                    10.12.2025
                </div>
                <div class="column">
                    TBA</div>
                <div class="column">Helsinki, FI</div>
                <div class="column"></div>

            </div>
            <div class="gallery">
                <img src="static/bandphoto.JPG" alt="Band photo">
            </div>

            <div class="contact">
                <h2>Contact</h2>
                <p>freedominationband@gmail.com</p>
                <p>© 2025 Freedomination</p>
                <div class="socials">
                    <a href="http://facebook.com/freedominationband"><img src="static/facebook-icon.png" alt="Facebook"></a>
                    <a href="http://instagram.com/freedominationband"><img src="static/youtube-icon.png" alt="Youtube"></a>
                    <a href="http://youtube.com/freedominationband"><img src="static/instagram-icon.png" alt="Instagram"></a>
                    <a href="http://tiktok.com/@freedominationband"><img src="static/tiktok-icon.png" alt="Tiktok"></a>
                </div>
            </div>
        </div>
</body>

</html>
